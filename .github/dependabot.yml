# Dependabot - Security updates only (inactive repo)
# Reduced noise: monthly schedule, 1 PR limit, security advisories only
version: 2
updates:
  # NPM security updates only
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 1
    # Only create PRs for security vulnerabilities
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "security(deps)"
    labels:
      - "security"
      - "dependencies"

  # GitHub Actions - security only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 1
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "security(ci)"
    labels:
      - "security"
      - "github-actions"
