name: Sync Content to DigitalOcean Spaces

on:
  workflow_dispatch:
    inputs:
      book:
        description: Specific book slug (leave empty for all)
        required: false
        type: string
      force:
        description: Upload even when size and checksum match
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Generate and publish content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOOK: ${{ inputs.book }}
      FORCE: ${{ inputs.force }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_BUCKET_NAME: ${{ vars.SPACES_BUCKET_NAME }}
      SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
      SPACES_REGION: ${{ vars.SPACES_REGION }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate formats
        run: |
          if [ -n "$BOOK" ]; then
            pnpm generate:formats book "$BOOK"
          else
            pnpm generate:formats all
          fi

      - name: Publish to Spaces
        run: |
          FORCE_ARG=()
          if [ "$FORCE" = "true" ]; then
            FORCE_ARG=(--force)
          fi

          if [ -n "$BOOK" ]; then
            pnpm sync:spaces book "$BOOK" "${FORCE_ARG[@]}"
          else
            pnpm sync:spaces all "${FORCE_ARG[@]}"
          fi

      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spaces-sync-${{ github.run_number }}
          path: |
            generated/
            sync-log.json
          retention-days: 30
          if-no-files-found: error
