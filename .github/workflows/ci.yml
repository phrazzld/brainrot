name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm typecheck

  test:
    name: Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run
        env:
          NODE_ENV: test

      # Coverage temporarily disabled until test suite is stabilized
      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v3
      #   if: matrix.node-version == '22'
      #   with:
      #     files: ./coverage/lcov.info
      #     flags: unittests
      #     name: coverage-${{ matrix.node-version }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7

  check-variant-files:
    name: Check for Variant Files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for prohibited variant files
        run: |
          echo "🔍 Checking for prohibited variant files in app source directories..."
          
          FOUND_FILES=""
          
          # Function to check directories for patterns
          check_directory() {
            local dir=$1
            local pattern=$2
            if [ -d "$dir" ]; then
              FILES=$(find "$dir" -name "$pattern" 2>/dev/null || true)
              if [ -n "$FILES" ]; then
                FOUND_FILES="$FOUND_FILES$FILES"$'\n'
              fi
            fi
          }
          
          # Check for *.updated.ts files
          check_directory "apps/web/app" "*.updated.ts"
          check_directory "apps/publisher/src" "*.updated.ts"
          check_directory "packages/@brainrot/*/src" "*.updated.ts"
          
          # Check for *.fixed.ts files  
          check_directory "apps/web/app" "*.fixed.ts"
          check_directory "apps/publisher/src" "*.fixed.ts"
          check_directory "packages/@brainrot/*/src" "*.fixed.ts"
          
          # Remove trailing newline and check if any files were found
          FOUND_FILES=$(echo "$FOUND_FILES" | sed '/^$/d')
          
          if [ -n "$FOUND_FILES" ]; then
            echo "❌ Found prohibited variant files in app source directories:"
            echo "$FOUND_FILES"
            echo ""
            echo "🚫 Files matching *.updated.ts or *.fixed.ts are not allowed in app source directories."
            echo "These files indicate temporary fixes that should be properly resolved before merging."
            echo ""
            echo "Please either:"
            echo "• Rename the files to remove .updated/.fixed suffixes"
            echo "• Move them outside of app source directories"  
            echo "• Delete them if no longer needed"
            exit 1
          else
            echo "✅ No prohibited variant files found in app source directories"
          fi

  # Playwright tests removed - no e2e tests currently defined
  # To re-enable when e2e tests are added:
  # 1. Define test:e2e script in package.json
  # 2. Uncomment this job
