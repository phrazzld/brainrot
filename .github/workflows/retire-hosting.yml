name: Retire Brainrot hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-space:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.SPACES_REGION }}
      BUCKET: ${{ vars.SPACES_BUCKET_NAME }}
      ENDPOINT: https://${{ vars.SPACES_ENDPOINT }}
    steps:
      - name: Delete every object version and the bucket
        shell: bash
        run: |
          set -euo pipefail
          while :; do
            aws --endpoint-url "$ENDPOINT" s3api list-object-versions \
              --bucket "$BUCKET" --max-items 1000 > /tmp/versions.json
            jq '{Objects: (((.Versions // []) + (.DeleteMarkers // [])) | map({Key, VersionId})), Quiet: true}' \
              /tmp/versions.json > /tmp/delete.json
            count=$(jq '.Objects | length' /tmp/delete.json)
            if [[ "$count" == "0" ]]; then
              break
            fi
            aws --endpoint-url "$ENDPOINT" s3api delete-objects \
              --bucket "$BUCKET" --delete file:///tmp/delete.json >/dev/null
          done
          aws --endpoint-url "$ENDPOINT" s3api list-multipart-uploads \
            --bucket "$BUCKET" > /tmp/uploads.json
          jq -r '.Uploads[]? | [.Key, .UploadId] | @tsv' /tmp/uploads.json |
            while IFS=$'\t' read -r key upload_id; do
              aws --endpoint-url "$ENDPOINT" s3api abort-multipart-upload \
                --bucket "$BUCKET" --key "$key" --upload-id "$upload_id"
            done
          aws --endpoint-url "$ENDPOINT" s3api delete-bucket --bucket "$BUCKET"
          if aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "bucket still exists" >&2
            exit 1
          fi
          echo "Brainrot Space deleted"
